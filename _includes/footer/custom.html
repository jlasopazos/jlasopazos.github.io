<!-- Support for MathJax -->
<script id="MathJax-script" defer src="https://cdn.jsdelivr.net/npm/mathjax@4.0.0/tex-mml-chtml.js"></script>

<script>
  document.querySelectorAll('a[href]').forEach(function (link) {
    var isPdf = /\.pdf$/i.test(link.pathname);
    var isExternal = /^https?:$/.test(link.protocol) && link.hostname !== window.location.hostname;
    if (isPdf || isExternal) {
      link.target = "_blank";
      link.rel = "noopener";
    }
  });
</script>
